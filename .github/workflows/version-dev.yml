name: Dev Release & Tagging

on:
  push:
    branches:
      - dev

jobs:
  tag-dev:
    name: Generate Dev Preview Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Dev Tag
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}-dev.${increment}"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.semver.outputs.version }}"
          echo "Tagging dev commit with $TAG"
          git tag -a "$TAG" -m "Automated dev build $TAG"
          git push origin "$TAG"
