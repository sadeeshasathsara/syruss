name: Conventional Commit Lint

on:
  pull_request:
    branches:
      - dev
      - test
      - main
    types: [opened, synchronize, reopened]

jobs:
  lint-last-commit:
    name: Check Last Commit Message
    runs-on: ubuntu-latest
    steps:
      - name: Get last commit message
        id: last_commit
        run: |
          MSG="${{ github.event.pull_request.head.sha }}"
          # Fetch just the last commit message from the PR head
          echo "sha=$MSG" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Validate last commit message
        run: |
          MSG=$(git log -1 --pretty=format:"%s")
          echo "Last commit: $MSG"

          # Conventional commit regex:
          # type(scope)!: description  OR  type!: description  OR  type(scope): description  OR  type: description
          # Allowed types: feat, fix, docs, style, refactor, perf, test, chore, build, ci, revert
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|chore|build|ci|revert)(\([a-zA-Z0-9_/-]+\))?(!)?: .+'

          if echo "$MSG" | grep -qP "$PATTERN"; then
            echo "✅ Commit message is valid: $MSG"
          else
            echo ""
            echo "❌ Last commit message does not follow Conventional Commits format."
            echo ""
            echo "  Found:    $MSG"
            echo ""
            echo "  Expected: <type>(<scope>): <description>"
            echo "            <type>!: <description>          (breaking change)"
            echo ""
            echo "  Allowed types:"
            echo "    feat      → new feature          (minor bump)"
            echo "    fix       → bug fix              (patch bump)"
            echo "    feat!     → breaking change      (major bump)"
            echo "    docs      → documentation only   (no bump)"
            echo "    chore     → maintenance          (no bump)"
            echo "    refactor  → code restructure     (no bump)"
            echo "    test      → tests only           (no bump)"
            echo "    style     → formatting only      (no bump)"
            echo "    perf      → performance          (no bump)"
            echo "    build     → build system         (no bump)"
            echo "    ci        → CI/CD changes        (no bump)"
            echo "    revert    → revert a commit      (no bump)"
            echo ""
            echo "  Examples:"
            echo "    feat(connections): add SAP S4HANA connector"
            echo "    fix(sftp): handle stale asyncpg connection pool"
            echo "    feat(auth)!: break v1 auth headers"
            echo "    chore: upgrade eslint to v9"
            echo ""
            exit 1
          fi
