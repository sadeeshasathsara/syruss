name: Package & Publish Container Images

on:
  push:
    branches:
      - dev
      - test
      - main

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      www: ${{ steps.filter.outputs.www }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/package.yml'
            agent:
              - 'agentic_framework/**'
              - '.github/workflows/package.yml'
            www:
              - 'www/**'
              - '.github/workflows/package.yml'
            site:
              - 'site/**'
              - '.github/workflows/package.yml'

  resolve-version:
    name: Resolve Target Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      env_tag: ${{ steps.calc.outputs.env_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Base SemVer
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"

      - name: Calculate Branch Specific Tag
        id: calc
        run: |
          BASE="v${{ steps.semver.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          INC="${{ steps.semver.outputs.increment }}"
          
          if [ "$BRANCH" = "dev" ]; then
            echo "version=${BASE}-dev.${INC}" >> $GITHUB_OUTPUT
            echo "env_tag=dev" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "test" ]; then
            echo "version=${BASE}-rc.${INC}" >> $GITHUB_OUTPUT
            echo "env_tag=test" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" = "main" ]; then
            echo "version=${BASE}" >> $GITHUB_OUTPUT
            echo "env_tag=latest" >> $GITHUB_OUTPUT
          fi

  package-server:
    name: Package API Server
    needs: [detect-changes, resolve-version]
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          build-args: |
            APP_VERSION=${{ needs.resolve-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ needs.resolve-version.outputs.env_tag }}
            ghcr.io/${{ github.repository }}/server:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-agent:
    name: Package AI Agent Worker
    needs: [detect-changes, resolve-version]
    if: needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./agentic_framework
          push: true
          build-args: |
            APP_VERSION=${{ needs.resolve-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ needs.resolve-version.outputs.env_tag }}
            ghcr.io/${{ github.repository }}/agent:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-www:
    name: Package Web App (www)
    needs: [detect-changes, resolve-version]
    if: needs.detect-changes.outputs.www == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./www
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/www:${{ needs.resolve-version.outputs.env_tag }}
            ghcr.io/${{ github.repository }}/www:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-site:
    name: Package Landing Site (site)
    needs: [detect-changes, resolve-version]
    if: needs.detect-changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./site
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.resolve-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}/site:${{ needs.resolve-version.outputs.env_tag }}
            ghcr.io/${{ github.repository }}/site:${{ needs.resolve-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
