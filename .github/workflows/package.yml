name: Package & Publish Container Images

on:
  push:
    branches:
      - dev
      - test
      - main

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Changeset Application & Version Resolution
  # ----------------------------------------------------------------------------
  prepare-release:
    name: Apply Changesets & Prepare Releases
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.apply.outputs.has_releases }}
      server_changed: ${{ steps.apply.outputs.server_changed }}
      server_version: ${{ steps.apply.outputs.server_version }}
      server_tag: ${{ steps.apply.outputs.server_tag }}
      agent_changed: ${{ steps.apply.outputs.agent_changed }}
      agent_version: ${{ steps.apply.outputs.agent_version }}
      agent_tag: ${{ steps.apply.outputs.agent_tag }}
      www_changed: ${{ steps.apply.outputs.www_changed }}
      www_version: ${{ steps.apply.outputs.www_version }}
      www_tag: ${{ steps.apply.outputs.www_tag }}
      site_changed: ${{ steps.apply.outputs.site_changed }}
      site_version: ${{ steps.apply.outputs.site_version }}
      site_tag: ${{ steps.apply.outputs.site_tag }}
      admin_changed: ${{ steps.apply.outputs.admin_changed }}
      admin_version: ${{ steps.apply.outputs.admin_version }}
      admin_tag: ${{ steps.apply.outputs.admin_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Changesets
        id: apply
        run: |
          python scripts/changeset.py apply --branch "${{ github.ref_name }}"

      - name: Commit CHANGELOG and push
        if: steps.apply.outputs.has_releases == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changeset/
          git commit -m "chore(release): update CHANGELOG and apply changesets [skip ci]" || echo "No changes to commit"
          git push origin "${{ github.ref_name }}"

  # ----------------------------------------------------------------------------
  # API Server (FastAPI Core)
  # ----------------------------------------------------------------------------
  release-server:
    name: Release & Package API Server
    needs: prepare-release
    if: needs.prepare-release.outputs.server_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.server_tag }}"
          VERSION="${{ needs.prepare-release.outputs.server_version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Server ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/server:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # AI Agent Worker (agentic_framework)
  # ----------------------------------------------------------------------------
  release-agent:
    name: Release & Package AI Agent Worker
    needs: prepare-release
    if: needs.prepare-release.outputs.agent_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.agent_tag }}"
          VERSION="${{ needs.prepare-release.outputs.agent_version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Agent ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./agentic_framework
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/agent:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Web Application (www)
  # ----------------------------------------------------------------------------
  release-www:
    name: Release & Package Web App (www)
    needs: prepare-release
    if: needs.prepare-release.outputs.www_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.www_tag }}"
          VERSION="${{ needs.prepare-release.outputs.www_version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Web App ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./www
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}
            NEXT_PUBLIC_SITE_URL=${{ github.ref_name == 'test' && vars.TEST_SITE_URL || 'http://localhost:3100' }}
            NEXT_PUBLIC_ACCOUNT_URL=${{ github.ref_name == 'test' && vars.TEST_ACCOUNT_URL || 'http://localhost:8080/realms/syruss/account' }}
          tags: |
            ghcr.io/${{ github.repository }}/www:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/www:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Landing & Onboarding Site (site)
  # ----------------------------------------------------------------------------
  release-site:
    name: Release & Package Landing Site (site)
    needs: prepare-release
    if: needs.prepare-release.outputs.site_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.site_tag }}"
          VERSION="${{ needs.prepare-release.outputs.site_version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Site ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./site
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/site:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/site:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # System Admin Dashboard (admin)
  # ----------------------------------------------------------------------------
  release-admin:
    name: Release & Package Admin Dashboard (admin)
    needs: prepare-release
    if: needs.prepare-release.outputs.admin_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ needs.prepare-release.outputs.admin_tag }}"
          VERSION="${{ needs.prepare-release.outputs.admin_version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Admin ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          build-args: |
            NEXT_PUBLIC_ADMIN_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/admin:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/admin:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Database image (Postgres + pgvector + Apache AGE), built here so servers only pull it
  # ----------------------------------------------------------------------------
  release-postgres:
    name: Package Postgres (pgvector + AGE)
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./bridge/postgres
          push: true
          tags: ghcr.io/${{ github.repository }}/postgres:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

  # ----------------------------------------------------------------------------
  # Test environment: after the images are published, tell the server (deploy/test/hook.py) to pull them.
  # Only the services released in this run are pulled. Nothing is built there.
  # Needs the repository secrets TEST_DEPLOY_URL (http://<server>:9100/deploy) and TEST_DEPLOY_SECRET.
  # ----------------------------------------------------------------------------
  deploy-test:
    name: Tell the test server to pull
    needs: [prepare-release, release-server, release-agent, release-www, release-site, release-postgres]
    # Runs even when some services had no release (their jobs are skipped), but not when one failed.
    if: ${{ !cancelled() && github.ref_name == 'test' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Call the deploy hook
        env:
          URL: ${{ secrets.TEST_DEPLOY_URL }}
          SECRET: ${{ secrets.TEST_DEPLOY_SECRET }}
          SERVER: ${{ needs.release-server.result }}
          AGENT: ${{ needs.release-agent.result }}
          WWW: ${{ needs.release-www.result }}
          SITE: ${{ needs.release-site.result }}
          POSTGRES: ${{ needs.release-postgres.result }}
        run: |
          services=""
          [ "$SERVER" = success ] && services="$services server"
          [ "$AGENT" = success ] && services="$services agent"
          [ "$WWW" = success ] && services="$services www"
          [ "$SITE" = success ] && services="$services site"
          [ "$POSTGRES" = success ] && services="$services postgres"
          list=$(printf '%s\n' $services | jq -R . | jq -sc .)
          body=$(jq -nc --argjson services "$list" --arg compose "$(base64 -w0 deploy/test/docker-compose.yml)" '{services: $services, compose: $compose}')
          stamp=$(date +%s)
          sig=$(printf '%s.%s' "$stamp" "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          curl --fail --show-error --silent --max-time 30 -X POST "$URL" \
            -H "X-Syruss-Timestamp: $stamp" -H "X-Syruss-Signature: $sig" -H "Content-Type: application/json" \
            --data "$body"
          echo " asked the server to pull:$services"
