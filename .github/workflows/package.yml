name: Package & Publish Container Images

on:
  push:
    branches:
      - dev
      - test
      - main

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      www: ${{ steps.filter.outputs.www }}
      site: ${{ steps.filter.outputs.site }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            agent:
              - 'agentic_framework/**'
            www:
              - 'www/**'
            site:
              - 'site/**'
            admin:
              - 'admin/**'

  # ----------------------------------------------------------------------------
  # API Server (FastAPI Core)
  # ----------------------------------------------------------------------------
  release-server:
    name: Release & Package API Server
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate SemVer for server
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "server-v"
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: ${{ github.ref_name == 'main' && '${major}.${minor}.${patch}' || (github.ref_name == 'test' && '${major}.${minor}.${patch}-rc.${increment}' || '${major}.${minor}.${patch}-dev.${increment}') }}

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="server-v${{ steps.semver.outputs.version }}"
          echo "GIT_TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=${{ steps.semver.outputs.version }}" >> $GITHUB_ENV
          echo "ENV_TAG=${{ github.ref_name == 'main' && 'latest' || github.ref_name }}" >> $GITHUB_ENV
          
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists."
          else
            echo "Creating tag $TAG"
            git tag -a "$TAG" -m "Automated release $TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release (Production)
        if: github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.GIT_TAG }}
          name: "Server ${{ env.GIT_TAG }}"
          generate_release_notes: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/server:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/server:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # AI Agent Worker (agentic_framework)
  # ----------------------------------------------------------------------------
