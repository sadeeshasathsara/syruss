          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./www
          push: true
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/www:${{ env.ENV_TAG }}
