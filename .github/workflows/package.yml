          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./agentic_framework
          push: true
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ github.repository }}/agent:${{ env.ENV_TAG }}
            ghcr.io/${{ github.repository }}/agent:v${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Web Application (www)
  # ----------------------------------------------------------------------------
  release-www:
    name: Release & Package Web App (www)
    needs: prepare-release
    if: needs.prepare-release.outputs.www_changed == 'true'
    runs-on: ubuntu-latest
