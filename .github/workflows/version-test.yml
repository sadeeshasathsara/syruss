name: Test / Staging RC Release

on:
  push:
    branches:
      - test

jobs:
  tag-rc:
    name: Generate Release Candidate Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate RC Tag
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}-rc.${increment}"

      - name: Create RC Tag & Pre-release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.semver.outputs.version }}"
          echo "Tagging test branch with $TAG"
          git tag -a "$TAG" -m "Release Candidate $TAG for testing/staging"
          git push origin "$TAG"
