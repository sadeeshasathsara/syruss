name: CI - Pull Request Validation

on:
  pull_request:
    branches:
      - dev
      - test
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      www: ${{ steps.filter.outputs.www }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$CHANGED"
          echo "server=$(echo "$CHANGED" | grep -qE '^(server/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "agent=$(echo "$CHANGED"  | grep -qE '^(agentic_framework/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "www=$(echo "$CHANGED"    | grep -qE '^(www/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "site=$(echo "$CHANGED"   | grep -qE '^(site/|\.github/workflows/ci\.yml)' && echo true || echo false)" >> $GITHUB_OUTPUT

  typecheck-frontend:
    name: Frontend Typecheck & Build
    needs: detect-changes
    if: needs.detect-changes.outputs.www == 'true' || needs.detect-changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            www/package-lock.json
            site/package-lock.json

      - name: Typecheck www
        if: needs.detect-changes.outputs.www == 'true'
        run: |
          cd www
          npm ci || npm install
          npx tsc --noEmit

      - name: Build www
        if: needs.detect-changes.outputs.www == 'true'
        run: |
          cd www
          npm run build

      - name: Typecheck site
        if: needs.detect-changes.outputs.site == 'true'
        run: |
          cd site
          npm ci || npm install
          npx tsc --noEmit

  test-server:
    name: Backend Server Tests
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: doc_intelligence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: alpine/minio:latest-release
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
        ports:
          - 9000:9000
        command: server /data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            agentic_framework/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r agentic_framework/requirements.txt

      - name: Run Pytest Suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: doc_intelligence_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadminpassword
          MINIO_BUCKET_NAME: documents-test
          MINIO_SECURE: "false"
          MAIL_BACKEND: memory
          REQUIRE_TRUSTED_DEVICE: "false"
          PUBLIC_SITE_URL: http://site.test
        run: |
          cd server
          pytest tests/ -v --tb=short
