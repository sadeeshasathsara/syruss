name: Production Release

on:
  push:
    branches:
      - main

jobs:
  release-prod:
    name: Generate Production Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Stable SemVer
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE|feat!)"
          minor_pattern: "feat"
          version_format: "${major}.${minor}.${patch}"

      - name: Create Production Release Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.semver.outputs.version_tag }}"
          echo "Releasing production version $TAG"
          git tag -a "$TAG" -m "Production release $TAG"
          git push origin "$TAG"
          
          # Create GitHub Release
          gh release create "$TAG" --title "$TAG" --generate-notes
