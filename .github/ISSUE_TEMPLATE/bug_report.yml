name: Bug report
description: Something doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **If this is a security problem, don't file it here**: use the private report link on the issue chooser (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Customer app (www)
        - Admin app (admin)
        - Site
        - API server
        - Agent
        - Mail service
        - Deployment / setup
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version shown at the bottom of the sidebar, or the commit you are running.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords, keys, tokens and anyone's personal data first.
