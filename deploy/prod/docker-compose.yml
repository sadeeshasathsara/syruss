# The production environment. Only pulls: every Syruss image is built by CI and published to ghcr
# (see .github/workflows/package.yml), nothing is built on the server.
#
# Secrets are in env/*.env on the server (never in git). Run from this folder:
#   docker compose --env-file env/stack.env pull && docker compose --env-file env/stack.env up -d
# Sized for a 4 GB machine; raise the limits with the machine.
name: syruss-prod

x-app: &app
  restart: unless-stopped
  pull_policy: missing  # updates come from the explicit `docker compose pull` the deploy hook runs
  # Every container: runs as a non-root user, has no Linux capabilities (root powers), can't gain privileges through
  # setuid programs, and has a cap on processes (a fork bomb or a runaway thread pool stops there).
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 1024


# Syruss's own services run as an unprivileged user and can't change their files: the filesystem is read-only except
# for scratch space in memory.
x-read-only: &read-only
  read_only: true

services:
  postgres:
    # Runs as the image's postgres user from the start (its data folder belongs to it): never root
    <<: *app
    user: "70:70"
    networks: [data]
    # Postgres 16 with pgvector and Apache AGE, built by CI from bridge/postgres
    image: ghcr.io/sadeeshasathsara/syruss/postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "work_mem=8MB"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Runs as the image's minio user from the start (bridge/minio/Dockerfile gives it /data): never root
    <<: *app
    user: "100:101"
    networks: [data, files]
    image: ghcr.io/sadeeshasathsara/syruss/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data
    mem_limit: 512m

  kafka:
    <<: *app
    networks: [data]
    # Single-node KRaft broker built by CI from bridge/kafka (settings baked in)
    image: ghcr.io/sadeeshasathsara/syruss/kafka:latest
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s

  keycloak-db:
    # Runs as the image's postgres user from the start (its data folder belongs to it): never root
    <<: *app
    user: "70:70"
    networks: [auth]
    image: ghcr.io/sadeeshasathsara/syruss/keycloak-db:latest
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    <<: *app
    networks: [auth, public]
    # Production-mode build with the realm and theme inside, made by CI from bridge/keycloak
    image: ghcr.io/sadeeshasathsara/syruss/keycloak:latest
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      SYRUSS_SITE_URL: ${SYRUSS_SITE_URL}
      SYRUSS_APP_URL: ${SYRUSS_APP_URL}
      SYRUSS_ADMIN_URL: ${SYRUSS_ADMIN_URL:-}
      SYRUSS_SITE_CLIENT_SECRET: ${SYRUSS_SITE_CLIENT_SECRET}
      SYRUSS_APP_CLIENT_SECRET: ${SYRUSS_APP_CLIENT_SECRET}
      SYRUSS_ADMIN_CLIENT_SECRET: ${SYRUSS_ADMIN_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: unset
      GOOGLE_CLIENT_SECRET: unset
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 768m
    healthcheck:
      # The management port answers /health/ready once the realm is imported and the server is accepting requests
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3
      interval: 15s
      timeout: 20s
      retries: 40
      start_period: 90s

  server:
    <<: [*app, *read-only]
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/syruss:size=16m,mode=1777"]
    networks: [data, public]
    image: ghcr.io/sadeeshasathsara/syruss/server:latest
    env_file: env/server.env
    environment:
      ENV: production
      # One server process: it applies database migrations as it starts (AUTO_MIGRATE). Run more and set it to false.
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    mem_limit: 1g
    healthcheck:
      # The image's own check allows 5 seconds, which a busy small server misses even while /health answers
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=20).status != 200)"]
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 120s

  agent:
    <<: [*app, *read-only]
    tmpfs: ["/tmp:size=128m,mode=1777", "/home/syruss:size=64m,mode=1777"]
    networks: [data, agent-egress]
    image: ghcr.io/sadeeshasathsara/syruss/agent:latest
    env_file: env/agent.env
    environment:
      ENV: production
    depends_on:
      - server
      - kafka
    mem_limit: 768m

  www:
    <<: [*app, *read-only]
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=128m,mode=1777"]
    networks: [public]
    image: ghcr.io/sadeeshasathsara/syruss/www:latest
    env_file: env/www.env
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m

  site:
    <<: [*app, *read-only]
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=64m,mode=1777"]
    networks: [public]
    image: ghcr.io/sadeeshasathsara/syruss/site:latest
    env_file: env/site.env
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 384m

  # The system admin app (platform staff only). Its settings are optional until the server has env/admin.env.
  admin:
    <<: [*app, *read-only]
    tmpfs: ["/tmp:size=64m,mode=1777", "/app/.next/cache:size=64m,mode=1777"]
    networks: [public]
    image: ghcr.io/sadeeshasathsara/syruss/admin:latest
    env_file:
      - path: env/admin.env
        required: false
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 384m

# Who can reach whom. The web apps reach the API and Keycloak, never a database; the databases, Kafka and object storage
# can't reach the internet. A container is on only the networks it needs.
networks:
  public: {}                 # web apps, the API, Keycloak (and the internet through it)
  data: {internal: true}     # the API, the agent, Postgres, Kafka, object storage
  auth: {internal: true}     # Keycloak and its database
  files: {}                  # object storage's published port (presigned downloads through Caddy)
  agent-egress: {}           # the agent's way out to the model provider

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  keycloak_db_data:
