[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syruss"
version = "0.1.0"
description = "Syruss Monorepo CLI and Developer Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
syruss = "scripts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "registry*"]
