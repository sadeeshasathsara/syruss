# Settings come from bridge/.env (see .env.example); the defaults below match it.
services:
  postgres:
    # Postgres 16 with pgvector and Apache AGE (see postgres/Dockerfile)
    build: ./postgres
    image: doc_intel_postgres:16-vector-age
    container_name: doc_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-doc_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: doc_intel_minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: doc_intel_kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-4L622nShTUiT8tOxvfutew}"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  keycloak-db:
    # Keycloak's own database: identity data never shares a server with business data
    image: postgres:16-alpine
    container_name: doc_intel_keycloak_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Authentication only (passwords, MFA, Google sign-in, sessions). What a person may do
    # lives in the core database. Local mode: start-dev. Production: build an optimized image
    # and run `start --optimized` behind TLS (see keycloak/README.md).
    image: quay.io/keycloak/keycloak:26.0
    container_name: doc_intel_keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
      KC_HEALTH_ENABLED: "true"
      # Substituted into realm-syruss.json at import
      SYRUSS_SITE_URL: ${SYRUSS_SITE_URL:-http://localhost:3100}
      SYRUSS_APP_URL: ${SYRUSS_APP_URL:-http://localhost:3000}
      SYRUSS_SITE_CLIENT_SECRET: ${SYRUSS_SITE_CLIENT_SECRET:-dev-site-secret-change-me}
      SYRUSS_APP_CLIENT_SECRET: ${SYRUSS_APP_CLIENT_SECRET:-dev-app-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-syruss.json:/opt/keycloak/data/import/realm-syruss.json:ro
      - ./keycloak/themes/syruss:/opt/keycloak/themes/syruss:ro

  mailpit:
    # Catches every email the API sends while developing: nothing leaves your machine.
    # Inbox: http://localhost:8025. The API's SMTP settings already point at port 1025.
    image: axllent/mailpit:latest
    container_name: doc_intel_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  keycloak_db_data:
  postgres_data:
  minio_data:
  kafka_data:

