# Settings come from bridge/.env (see .env.example); the defaults below match it.
#
# Locked down like the servers (deploy/prod), within what local development needs:
#   - every port answers on this machine only (127.0.0.1), never on the Wi-Fi or office network: these services use
#     development passwords (BIND_HOST=0.0.0.0 in bridge/.env opens them up again, for a VM that needs them)
#   - no container runs as root, none keeps any Linux capability (root power) or can gain privileges, and each has a
#     process limit
#   - every image is pinned to an exact version

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 1024


services:
  postgres:
    # Postgres 16 with pgvector and Apache AGE (see postgres/Dockerfile)
    build: ./postgres
    image: doc_intel_postgres:16-vector-age
    container_name: doc_intel_postgres
    # Runs as the image's postgres user from the start (its data folder belongs to it): never root
    <<: *hardened
    user: "70:70"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-doc_intelligence}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    build: ./minio
    image: doc_intel_minio:local
    container_name: doc_intel_minio
    # Runs as the image's minio user from the start (bridge/minio/Dockerfile gives it /data): never root
    <<: *hardened
    user: "100:101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    container_name: doc_intel_kafka
    <<: *hardened
    ports:
      - "${BIND_HOST:-127.0.0.1}:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-4L622nShTUiT8tOxvfutew}"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  keycloak-db:
    # Keycloak's own database: identity data never shares a server with business data
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    container_name: doc_intel_keycloak_db
    # Runs as the image's postgres user from the start (its data folder belongs to it): never root
    <<: *hardened
    user: "70:70"
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Authentication only (passwords, MFA, Google sign-in, sessions). What a person may do
    # lives in the core database. Local mode: start-dev. Production: build an optimized image
    # and run `start --optimized` behind TLS (see keycloak/README.md).
    image: quay.io/keycloak/keycloak:26.7@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
    container_name: doc_intel_keycloak
    <<: *hardened
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-change-me}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-change-me}
      KC_HEALTH_ENABLED: "true"
      # Substituted into realm-syruss.json at import
      SYRUSS_SITE_URL: ${SYRUSS_SITE_URL:-http://localhost:3100}
      SYRUSS_APP_URL: ${SYRUSS_APP_URL:-http://localhost:3000}
      SYRUSS_ADMIN_URL: ${SYRUSS_ADMIN_URL:-http://localhost:3200}
      SYRUSS_SITE_CLIENT_SECRET: ${SYRUSS_SITE_CLIENT_SECRET:-dev-site-secret-change-me}
      SYRUSS_APP_CLIENT_SECRET: ${SYRUSS_APP_CLIENT_SECRET:-dev-app-secret-change-me}
      SYRUSS_ADMIN_CLIENT_SECRET: ${SYRUSS_ADMIN_CLIENT_SECRET:-dev-admin-secret-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-syruss.json:/opt/keycloak/data/import/realm-syruss.json:ro
      - ./keycloak/themes/syruss:/opt/keycloak/themes/syruss:ro

  mailpit:
    # Catches every email the API sends while developing: nothing leaves your machine.
    # Inbox: http://localhost:8025. The API's SMTP settings already point at port 1025.
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    container_name: doc_intel_mailpit
    <<: *hardened
    user: "65534:65534"  # nobody: it keeps mail in memory and a temporary file
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_HOST:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  keycloak_db_data:
  postgres_data:
  minio_data:
  kafka_data:

